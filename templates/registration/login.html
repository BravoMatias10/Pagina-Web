{% extends "base.html" %}
{% block content %}
    <div class="eyebrow">BIENVENIDO A AUDITA</div>
    <h1>Privacidad que puedes revisar.</h1>
    <p>Accede a tu espacio de auditorías e informes.</p>
    <section class="panel narrow">
        <h2>Iniciar sesión</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button>Entrar al espacio de trabajo →</button>
        </form>
        <p class="muted">
            ¿Aún no tienes cuenta?
            <a href="{% url 'register' %}">Crear una cuenta</a>
        </p>
    </section>
{% endblock %}
